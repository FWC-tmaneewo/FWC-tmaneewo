<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Exercise 02bis - It's over 9000 (jQuery)</title>
  <link rel="stylesheet" href="calc.css">
</head>
<body>

  <form id="calcForm" class="calculator">
    <h1>It's over 9000</h1>

    <input type="text" id="leftMember" name="leftMember" placeholder="Left member">

    <select id="operator" name="operator">
      <option value="+">+</option>
      <option value="-">-</option>
      <option value="*">*</option>
      <option value="/">/</option>
      <option value="%">%</option>
    </select>

    <input type="text" id="rightMember" name="rightMember" placeholder="Right member">

    <input type="submit" id="submitBtn" value="Try me!">
  </form>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="calc.js"></script>
</body>
</html>

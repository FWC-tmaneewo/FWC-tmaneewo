
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloon Game (jQuery)</title>

    <style>
        body {
            margin: 0;
            background-color: #f5f5f5;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        #balloon {
            width: 200px;
            height: 200px;
            background-color: red;
            border-radius: 50%;
            margin-top: 200px;
            cursor: pointer;
            transition: 0.2s;
        }

        #balloon.pop {
            transform: scale(1.3);
            opacity: 0;
        }
    </style>
</head>

<body>

    <div class="container">
        <div id="balloon"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>

        // ขนาดเริ่มต้น
        let size = 200;

        // ขนาดสูงสุดก่อนแตก
        const maxSize = 420;

        // สีของบอลลูน
        const colors = ["red", "green", "blue"];

        // ตำแหน่งสีปัจจุบัน
        let colorIndex = 0;

        $(document).ready(function () {

            // เมื่อคลิกบอลลูน
            $("#balloon").on("click", function () {
                addSize();
            });
        });

        // เมื่อคลิกบอลลูน
        function addSize() {

            // เพิ่มขนาด 10px
            size = size + 10;

            // เปลี่ยนสี
            colorIndex = (colorIndex + 1) % colors.length;

            $("#balloon").css("background-color", colors[colorIndex]);

            // เปลี่ยนขนาด
            $("#balloon").css({
                width: size + "px",
                height: size + "px"
            });

            // ถ้าถึง 420px ให้บอลลูนแตก
            if (size >= maxSize) {
                popBalloon();
            }
        }

        // ฟังก์ชันบอลลูนแตก
        function popBalloon() {

            const $balloon = $("#balloon");

            // ใส่เอฟเฟกต์แตก
            $balloon.addClass("pop");

            // รอ 500ms แล้วสร้างบอลลูนใหม่
            setTimeout(function () {

                size = 200;
                colorIndex = 0;

                $balloon.css({
                    width: "200px",
                    height: "200px",
                    "background-color": "red"
                });

                $balloon.removeClass("pop");

            }, 420);
        }

    </script>

</body>
</html>
